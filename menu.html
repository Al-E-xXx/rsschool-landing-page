<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./assets/css/style.css">

    <link rel="icon" type="image/x-icon" href="./favicon.ico">

    <title>Coffee House - Menu</title>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <header class="header">
            <a class="header__logo" href="./"></a>

            <nav class="header__menu">
                <a class="header__menu-btn link" href="./index.html#favorite-coffee">
                    <span>Favorite coffee</span>
                    <span class="link__underline"></span>
                </a>
                <a class="header__menu-btn link" href="./index.html#about">
                <span>About</span>
                <span class="link__underline"></span>
                </a>
                <a class="header__menu-btn link" href="./index.html#mob-app">
                <span>Mobile app</span>
                <span class="link__underline"></span>
                </a>
                <a class="header__menu-btn link" href="#contact-us">
                <span>Contact us</span>
                <span class="link__underline"></span>
                </a>
            </nav>

            <div class="header__btns-wrapper">
                <button class="header__mob-menu"></button>
                <a class="header__menu-btn header__menu-btn_coffee link" href="./menu.html">
                    <span>Menu</span>
                    <span class="link__underline"></span>
                </a>
                <button class="header__theme" id="theme-toggle"></button>
            </div>
        </header>

        <main class="main">
            <h1></h1>
        </main>

        <footer class="footer" id="contact-us">
            <div class="footer__column">
                <h2 class="footer__title">
                    Sip,&nbsp;Savor,&nbsp;Smile.<br> 
                    <span class="footer__title_accent title-accent">
                        It’s&nbsp;coffee&nbsp;time!
                    </span>
                </h2>
                <div class="footer__links-wrapper">
                    <a class="footer__social-link" href="https://x.com/" target="_blank">
                        <svg class="contact-us__btn-svg" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M23 3.01006C23 3.01006 20.9821 4.20217 19.86 4.54006C19.2577 3.84757 18.4573 3.35675 17.567 3.13398C16.6767 2.91122 15.7395 2.96725 14.8821 3.29451C14.0247 3.62177 13.2884 4.20446 12.773 4.96377C12.2575 5.72309 11.9877 6.62239 12 7.54006V8.54006C10.2426 8.58562 8.50127 8.19587 6.93101 7.4055C5.36074 6.61513 4.01032 5.44869 3 4.01006C3 4.01006 -1 13.0101 8 17.0101C5.94053 18.408 3.48716 19.109 1 19.0101C10 24.0101 21 19.0101 21 7.51006C20.9991 7.23151 20.9723 6.95365 20.92 6.68006C21.9406 5.67355 23 3.01006 23 3.01006Z" stroke="#E1D4C9" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </a>
                    <a class="footer__social-link" href="https://www.instagram.com/" target="_blank">
                        <svg class="contact-us__btn-svg" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16Z" stroke="#E1D4C9" stroke-linecap="round" stroke-linejoin="round"></path>
                            <path d="M3 16V8C3 5.23858 5.23858 3 8 3H16C18.7614 3 21 5.23858 21 8V16C21 18.7614 18.7614 21 16 21H8C5.23858 21 3 18.7614 3 16Z" stroke="#E1D4C9"></path>
                            <path d="M17 6.51L17.51 6.49889" stroke="#E1D4C9" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </a>
                    <a class="footer__social-link" href="https://www.facebook.com/" target="_blank">
                        <svg class="contact-us__btn-svg" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17 2H14C12.6739 2 11.4021 2.52678 10.4645 3.46447C9.52678 4.40215 9 5.67392 9 7V10H6V14H9V22H13V14H16L17 10H13V7C13 6.73478 13.1054 6.48043 13.2929 6.29289C13.4804 6.10536 13.7348 6 14 6H17V2Z" stroke="#E1D4C9" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </a>
                </div>
            </div>
            <div class="footer__column footer__column_right">
                <div class="footer__contacts-wrapper">
                    <h3 class="footer__subtitle">Contact us</h3>
                    <a class="footer__link" href="https://maps.app.goo.gl/5WCi4WLvcCcSNafm6" target="_blank">
                        <span>8558 Green Rd., LA</span>
                        <span class="footer__link-underline"></span>
                    </a>
                    <a class="footer__link footer__link_phone" href="tel:+16035550123">
                        <span>+1 (603) 555-0123</span>
                        <span class="footer__link-underline"></span>
                    </a>
                    <p class="footer__time">
                        <span>Mon–Sat: 9:00–23:00</span>
                    </p>
                </div>
            </div>
        </footer>
    </div>

    <script type="module" src="./assets/js/main.js"></script>
</body>
</html>
