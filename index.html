<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./assets/css/style.css">

    <link rel="icon" type="image/x-icon" href="./favicon.ico">

    <title>Coffee House</title>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <header class="header">
            <a class="header__logo" href="./"></a>

            <nav class="header__menu">
                <a class="header__menu-btn link" href="#favorite-coffee">
                    <span>Favorite coffee</span>
                    <span class="link__underline"></span>
                </a>
                <a class="header__menu-btn link" href="#about">
                <span>About</span>
                <span class="link__underline"></span>
                </a>
                <a class="header__menu-btn link" href="#mob-app">
                <span>Mobile app</span>
                <span class="link__underline"></span>
                </a>
                <a class="header__menu-btn link" href="#contact-us">
                <span>Contact us</span>
                <span class="link__underline"></span>
                </a>
            </nav>

            <div class="header__btns-wrapper">
                <a class="header__menu-btn header__menu-btn_coffee link" href="./menu.html">
                    <span>Menu</span>
                    <span class="link__underline"></span>
                </a>
                <button class="header__theme" id="theme-toggle"></button>
            </div>
        </header>

        <main class="main">
            <section>
                <h1>
                    Уважаемый Reviewer1!<br>
                    Наша чудесная кофейня откроется только завтра(
                </h1>
                <h2>
                    Но если вам не терпиться оценить полуфабрикат, а не настоящий кофе, приготовленный не самыми плохими в RSS барристами, то как я могу вам помешать?)
                </h2>
            </section>
        </main>

        <footer class="footer">

        </footer>
    </div>

    <script type="module" src="./assets/js/main.js"></script>
</body>
</html>
